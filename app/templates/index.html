<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komic</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Komic</h1>
    <nav>
      <a href="/">所有漫画</a>
      <button hx-post="/api/scan" hx-swap="none"
              hx-on:htmx:after-request="if(event.detail.xhr.status==202)this.disabled=true;
                                         if(event.detail.xhr.status==409)alert('扫描正在进行中')">
        重新扫描
      </button>
    </nav>
    <div class="toolbar"
         hx-get="/comics" hx-target="#comic-grid" hx-swap="outerHTML"
         hx-trigger="change from:#rating-filter, change from:#tag-filter, change from:#sort-by, change from:#sort-dir, keyup changed delay:300ms from:#search">
      <input type="text" id="search" placeholder="搜索漫画..." name="search">
      <select id="rating-filter" name="rating">
        <option value="">全部评分</option>
        <option value="0">未评分</option>
        <option value="5">5 星</option>
        <option value="4">4 星</option>
        <option value="3">3 星</option>
        <option value="2">2 星</option>
        <option value="1">1 星</option>
      </select>
      <select id="tag-filter" name="tag">
        <option value="">全部标签</option>
        {% for tag in tags %}
        <option value="{{ tag.name }}">{{ tag.name }}</option>
        {% endfor %}
      </select>
      <select id="sort-by" name="sort_by">
        <option value="title">按标题</option>
        <option value="file_mtime">按修改时间</option>
      </select>
      <select id="sort-dir" name="sort_dir">
        <option value="asc">升序</option>
        <option value="desc">降序</option>
      </select>
    </div>
  </header>

  <main>
    <div id="scan-progress"
         hx-get="/api/scan/progress-bar"
         hx-trigger="scan-started from:body"
         hx-swap="outerHTML"></div>
    <div id="comic-grid" class="comic-grid" hx-get="/comics" hx-trigger="load, scan-complete from:body" hx-swap="outerHTML">
      加载中...
    </div>
  </main>
</body>
</html>
